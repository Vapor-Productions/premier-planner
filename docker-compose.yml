# Local stack with its own Postgres. Production runs on the panel against Neon, not this file.
services:
  app:
    build: .
    env_file: .env
    environment:
      # Overrides .env so the app talks to the db service below
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
    # Apply pending migrations before starting
    command: sh -c "npx prisma migrate deploy && node build/main.js"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Local access only; never expose Postgres with default credentials publicly
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
